
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Editar Infração</title>
    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet" />
</head>

<body>

    <div th:insert="~{Menu :: menu}"></div>

    <div class="card" style="margin: 10px">
        <div class="card-header">
            <h1 class="card-title">Editar Infração Cadastrada - Roosevelt Silva</h1>
        </div>
        <div class="card-body">

            <form method="POST" th:object="${infracao}" th:action="@{/infracoes}" style="margin: 20px 0">

                <div class="d-flex align-items-center gap-2">

                    <input type="hidden" class="form-control" readonly="readonly" th:field="*{id}" />

                    <input type="text" class="form-control" placeholder="Descrição" th:field="*{descricao}"
                        style="max-width: 300px;" />

                    <input type="number" class="form-control" placeholder="Pontos" th:field="*{pontos}"
                        style="max-width: 120px;" />

                    <input type="number" step="0.01" class="form-control" placeholder="Valor" th:field="*{valor}"
                        style="max-width: 150px;" />

                    <button type="submit" class="btn btn-primary">Salvar</button>

                </div>

            </form>
        </div>
    </div>
</body>

</html>
