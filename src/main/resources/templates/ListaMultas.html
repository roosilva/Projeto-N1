
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Lista de Multas</title>
    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet" />
</head>

<body>

    <div th:insert="~{Menu :: menu}"></div>

    <div class="card" style="margin: 10px">
        <div class="card-header">
            <h1 class="card-title">Lista de Multas Cadastradas - Roosevelt Silva</h1>
        </div>

        <div class="card-body">

            <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

            <form method="POST" th:object="${multa}" th:action="@{/multas}" style="margin: 20px 0">

                <div class="d-flex align-items-center gap-2 flex-wrap">

                    <input type="text" name="placa" class="form-control"
                        placeholder="Placa do Carro"
                        style="max-width: 180px;" required />

                    <input type="text" class="form-control"
                        placeholder="Ano" th:field="*{ano}"
                        maxlength="4"
                        style="max-width: 120px;" required />

                    <input type="text" class="form-control"
                        placeholder="Cidade" th:field="*{cidade}"
                        style="max-width: 200px;" required />

                    <select class="form-select" th:field="*{infracao.id}"
                        style="max-width: 300px;" required>

                        <option value="">Selecione a Infração</option>

                        <option th:each="infracao : ${infracoes}"
                            th:value="${infracao.id}"
                            th:text="${infracao.descricao}">
                        </option>

                    </select>

                    <button type="submit" class="btn btn-primary">Salvar</button>

                </div>

            </form>

            <table class="table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Placa</th>
                        <th>Ano</th>
                        <th>Cidade</th>
                        <th>Infração</th>
                        <th>Pontos</th>
                        <th>Valor</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="multa : ${multas}">
                        <td th:text="${multa.id}"></td>
                        <td th:text="${multa.carro.placa}"></td>
                        <td th:text="${multa.ano}"></td>
                        <td th:text="${multa.cidade}"></td>
                        <td th:text="${multa.infracao.descricao}"></td>
                        <td th:text="${multa.infracao.pontos}"></td>
                        <td th:text="${multa.infracao.valor}"></td>
                    </tr>
                </tbody>

            </table>

        </div>
    </div>

</body>
</html>
